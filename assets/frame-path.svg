<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Frame path on a hybrid graphics laptop: Firefox content process to the compositor, then Windows chooses the GPU, either the Intel UHD or the RTX 4060, both feeding the 360 Hz panel">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#55647E"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#E5484D"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#3FB950"/>
    </marker>
  </defs>

  <rect width="1280" height="320" fill="#0B1220"/>
  <rect width="1280" height="320" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <text x="40" y="44" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">Where the frames go</text>
  <text x="40" y="68" fill="#8FA0BF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Hybrid mode: Windows picks the GPU per program, and a browser usually gets the power-saving one.</text>

  <!-- A -->
  <rect x="40" y="128" width="200" height="64" rx="10" fill="#141D2F" stroke="#55647E"/>
  <text x="140" y="154" text-anchor="middle" fill="#E7ECF7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Firefox</text>
  <text x="140" y="174" text-anchor="middle" fill="#8FA0BF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">content process</text>

  <!-- B -->
  <rect x="280" y="128" width="200" height="64" rx="10" fill="#141D2F" stroke="#55647E"/>
  <text x="380" y="154" text-anchor="middle" fill="#E7ECF7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Compositor</text>
  <text x="380" y="174" text-anchor="middle" fill="#8FA0BF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">WebRender</text>

  <!-- C -->
  <rect x="520" y="118" width="200" height="84" rx="10" fill="#2A2110" stroke="#E2A336" stroke-dasharray="5 4"/>
  <text x="620" y="148" text-anchor="middle" fill="#F6E7C8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Windows picks</text>
  <text x="620" y="168" text-anchor="middle" fill="#F6E7C8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">the GPU</text>
  <text x="620" y="188" text-anchor="middle" fill="#C9A45E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5">per-app preference</text>

  <!-- D -->
  <rect x="760" y="52" width="200" height="64" rx="10" fill="#3B1620" stroke="#E5484D"/>
  <text x="860" y="78" text-anchor="middle" fill="#FFD7DA" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Intel UHD</text>
  <text x="860" y="98" text-anchor="middle" fill="#E9A9AE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">default: save power</text>

  <!-- E -->
  <rect x="760" y="196" width="200" height="64" rx="10" fill="#0F2A18" stroke="#3FB950"/>
  <text x="860" y="222" text-anchor="middle" fill="#D6F5DE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">RTX 4060</text>
  <text x="860" y="242" text-anchor="middle" fill="#8FD6A2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">High performance</text>

  <!-- F -->
  <rect x="1010" y="128" width="200" height="64" rx="10" fill="#141D2F" stroke="#55647E"/>
  <text x="1110" y="154" text-anchor="middle" fill="#E7ECF7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Panel</text>
  <text x="1110" y="174" text-anchor="middle" fill="#8FA0BF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">360 Hz · 2.78 ms</text>

  <!-- arrows -->
  <path d="M240 160H272" stroke="#55647E" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M480 160H512" stroke="#55647E" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M720 145L752 96" stroke="#E5484D" stroke-width="2" marker-end="url(#arRed)"/>
  <path d="M720 176L752 220" stroke="#3FB950" stroke-width="2" marker-end="url(#arGreen)"/>
  <path d="M960 84L1002 140" stroke="#55647E" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M960 228L1002 182" stroke="#55647E" stroke-width="2" marker-end="url(#ar)"/>

  <text x="40" y="296" fill="#6F7F99" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Two GPUs, one panel. Step 2 decides which one draws — and on battery you may prefer the red path.</text>
</svg>
