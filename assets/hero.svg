<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Firefox, but butter-smooth — a tuning guide for Windows machines with two GPUs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="0.55" stop-color="#0E1730"/>
      <stop offset="1" stop-color="#1A1030"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7139" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF7139" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#76B900" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="0.5" stop-color="#FF7139"/>
      <stop offset="1" stop-color="#FFC46B"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7139"/>
      <stop offset="0.5" stop-color="#76B900"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7139"/>
      <stop offset="1" stop-color="#FFC46B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="1180" cy="60" rx="360" ry="240" fill="url(#glowOrange)"/>
  <ellipse cx="120" cy="400" rx="340" ry="220" fill="url(#glowGreen)"/>

  <!-- speed streaks -->
  <g stroke="url(#rail)" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <path d="M900 96h150"/>
    <path d="M960 118h90"/>
    <path d="M1010 330h70"/>
  </g>

  <!-- left block -->
  <g>
    <text x="64" y="86" fill="#8FA0BF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.4">WINDOWS · FIREFOX · HYBRID GRAPHICS</text>

    <text x="62" y="156" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.8">Firefox, but</text>
    <text x="62" y="212" fill="url(#titleGrad)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.8">butter-smooth.</text>

    <text x="64" y="252" fill="#A9B6CE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17">Ten steps, ordered by what actually moved the needle — pros, cons, and the prefs that do nothing.</text>

    <!-- chips -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="64" y="282" width="120" height="38" rx="19" fill="#FF7139" fill-opacity="0.14" stroke="#FF7139" stroke-opacity="0.55"/>
      <text x="86" y="307" fill="#FFB08A">60–360 Hz</text>

      <rect x="196" y="282" width="128" height="38" rx="19" fill="#76B900" fill-opacity="0.14" stroke="#76B900" stroke-opacity="0.55"/>
      <text x="218" y="307" fill="#B8E36A">hybrid GPU</text>

      <rect x="336" y="282" width="150" height="38" rx="19" fill="#0071C5" fill-opacity="0.18" stroke="#0071C5" stroke-opacity="0.6"/>
      <text x="358" y="307" fill="#8EC9F0">Windows 11</text>

      <rect x="498" y="282" width="164" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.18" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <text x="520" y="307" fill="#C9B4FF">Firefox 160</text>
    </g>
  </g>

  <!-- gauge -->
  <g transform="translate(1072,206)">
    <circle r="104" fill="#0B1220" fill-opacity="0.55"/>
    <circle r="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="10"/>
    <circle r="104" fill="none" stroke="url(#gauge)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="653.5" stroke-dashoffset="65" transform="rotate(-90)"/>
    <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800">2.8–16.7</text>
    <text x="0" y="18" text-anchor="middle" fill="#FF9A6B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">MS PER FRAME</text>
    <text x="0" y="46" text-anchor="middle" fill="#8FA0BF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">60 → 360 Hz</text>
  </g>

  <rect x="0" y="408" width="1280" height="8" fill="url(#rail)"/>
  <rect x="0" y="416" width="1280" height="4" fill="#070B16"/>
</svg>
